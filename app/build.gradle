plugins {
    alias(libs.plugins.android.application)
}

// Релизный ключ лежит вне репозитория, пароль — только в переменной окружения
def releaseKeystore = file(providers.gradleProperty('giro.keystore')
        .getOrElse("${System.getProperty('user.home')}/keys/giro-release.jks"))
def releaseStorePassword = providers.environmentVariable('GIRO_STORE_PASSWORD').getOrNull()
def hasReleaseKey = releaseKeystore.isFile() && releaseStorePassword
if (!hasReleaseKey) {
    logger.info('Giro: release-ключ или GIRO_STORE_PASSWORD не найдены, release подпишется debug-ключом')
}

android {
    namespace = 'com.motioncues.app'
    compileSdk = 37
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'com.motioncues.app'
        minSdk = 31
        targetSdk = 37
        versionCode = 2
        versionName = '0.2.0'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile = releaseKeystore
                storePassword = releaseStorePassword
                keyAlias = providers.gradleProperty('giro.keyAlias').getOrElse('giro')
                keyPassword = providers.environmentVariable('GIRO_KEY_PASSWORD').getOrElse(releaseStorePassword)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Без релизного ключа подписываем debug-ключом, чтобы release ставился на устройство
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = false
    }

    androidResources {
        // Переводы библиотек на другие языки не нужны — экономим размер APK
        localeFilters += ['ru', 'en']
    }

    packaging {
        resources {
            // Метаданные Kotlin приходят транзитивно из AndroidX и в рантайме не используются
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/**/LICENSE.txt', 'DebugProbesKt.bin']
        }
    }
}

dependencies {
    implementation libs.material

    testImplementation libs.junit
}
