plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.motioncues.app'
    compileSdk = 37
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'com.motioncues.app'
        minSdk = 31
        targetSdk = 37
        versionCode = 1
        versionName = '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Пока нет своего ключа — подписываем debug-ключом, чтобы release ставился на устройство
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = false
    }

    androidResources {
        // Переводы библиотек на другие языки не нужны — экономим размер APK
        localeFilters += ['ru', 'en']
    }

    packaging {
        resources {
            // Метаданные Kotlin приходят транзитивно из AndroidX и в рантайме не используются
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/**/LICENSE.txt', 'DebugProbesKt.bin']
        }
    }
}

dependencies {
    implementation libs.material

    testImplementation libs.junit
}
